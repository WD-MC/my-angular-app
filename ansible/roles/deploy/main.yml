# roles/deploy/tasks/main.yml
---
- name: Ensure Apache is installed
  apt:
    name: apache2
    state: present
    update_cache: yes

- name: Ensure rsync is installed
  apt:
    name: rsync
    state: present

# Diagnostic tasks
- name: Check if port 80 is in use
  shell: netstat -tuln | grep ":80 "
  register: port_check
  ignore_errors: yes

- name: Display port 80 status
  debug:
    msg: "Port 80 status: {{ port_check.stdout }}"

- name: Check Apache configuration
  shell: apachectl configtest
  register: apache_config
  ignore_errors: yes

- name: Display Apache configuration status
  debug:
    msg: "Apache config test: {{ apache_config.stdout }}"

- name: Ensure Apache is running
  service:
    name: apache2
    state: started
    enabled: yes

- name: Ensure web directory exists
  file:
    path: /var/www/html/my-angular-app
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Copy built files to Apache
  synchronize:
    src: /var/lib/jenkins/workspace/ansible-deployment/dist/my-angular-app/
    dest: /var/www/html/my-angular-app/
    delete: yes
  delegate_to: "{{ inventory_hostname }}"

- name: Set proper permissions
  file:
    path: /var/www/html/my-angular-app
    owner: www-data
    group: www-data
    mode: '0755'
    recurse: yes