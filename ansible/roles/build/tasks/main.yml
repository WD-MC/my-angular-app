---
# tasks file for build
#build project
  - name: Build app
    shell: |
      export PATH=/var/lib/jenkins/tools/jenkins.plugins.nodejs.tools.NodeJSInstallation/NODEJS/bin:$PATH
      cd /var/lib/jenkins/workspace/ansible-deployment
      /var/lib/jenkins/tools/jenkins.plugins.nodejs.tools.NodeJSInstallation/NODEJS/bin/npm run build -- --configuration production
    args:
      chdir: /var/lib/jenkins/workspace/ansible-deployment

  - name: Set permissions
    file:
      path: /var/lib/jenkins/workspace/ansible-deployment/dist
      state: directory
      mode: '0777'
      recurse: yes

  - name: Deploy files to Apache web server
    synchronize:
      src: /var/lib/jenkins/workspace/ansible-deployment/dist/
      dest: /var/www/html/
      owner: yes
      group: www-data
      mode: '0755'
      recursive: yes

  - name: Set permissions on Apache web server files
    file:
      path: /var/www/html/
      state: directory
      mode: '0755'
      recurse: yes

  - name: Restart Apache service
    service:
      name: apache2
      state: restarted