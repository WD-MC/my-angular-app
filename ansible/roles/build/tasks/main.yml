---
# tasks file for build
#build project
  - name: Build app
    shell: |
      export PATH=/var/lib/jenkins/tools/jenkins.plugins.nodejs.tools.NodeJSInstallation/NODEJS/bin:$PATH
      cd /var/lib/jenkins/workspace/ansible-deployment
      /var/lib/jenkins/tools/jenkins.plugins.nodejs.tools.NodeJSInstallation/NODEJS/bin/npm run build -- --configuration production
    args:
      chdir: /var/lib/jenkins/workspace/ansible-deployment

  - name: Set permissions
    file:
      path: /var/lib/jenkins/workspace/ansible-deployment/dist
      state: directory
      mode: '0777'
      recurse: yes
      
  # tasks file for deploy
  - name: Ensure Apache is installed
    apt:
      name: apache2
      state: present
      update_cache: yes

  - name: Ensure rsync is installed
    apt:
      name: rsync
      state: present

  - name: Ensure Apache is running
    service:
      name: apache2
      state: started
      enabled: yes

  - name: Ensure web directory exists
    file:
      path: /var/www/html/my-angular-app
      state: directory
      owner: www-data
      group: www-data
      mode: '0755'

  - name: Copy built files to Apache
    synchronize:
      src: /var/lib/jenkins/workspace/ansible-deployment/dist/my-angular-app/
      dest: /var/www/html/my-angular-app/
      delete: yes
      rsync_opts:
        - "--chmod=u=rwX,g=rX,o=rX"

  - name: Set proper permissions
    file:
      path: /var/www/html/my-angular-app
      owner: www-data
      group: www-data
      mode: '0755'
      recurse: yes

  - name: Configure Apache virtual host
    template:
      src: vhost.conf.j2
      dest: /etc/apache2/sites-available/my-angular-app.conf
    notify: restart apache

  - name: Enable site
    command: a2ensite my-angular-app.conf
    args:
      creates: /etc/apache2/sites-enabled/my-angular-app.conf
    notify: restart apache

  - name: Ensure mod_rewrite is enabled
    command: a2enmod rewrite
    args:
      creates: /etc/apache2/mods-enabled/rewrite.load
    notify: restart apache