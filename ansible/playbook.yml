---
- name: Déployer l'application Angular avec Apache
  hosts: all
  become: false
  roles:
    - build
  tasks:
    #- name: Vérifier si Apache est installé
      #command: dpkg-query -W apache2
      #register: apache_installed
      #ignore_errors: yes
      #changed_when: false
    

    - name: Check if apache2 is installed
      command: dpkg-query -W apache2
      register: package\_check\_deb
      failed\_when: package\_check\_deb.rc \&gt; 1
      changed\_when: package\_check\_deb.rc == 1


    #- name: Installer Apache (si non installé)
      #apt:
        #name: apache2
        #state: present
        #update_cache: yes
      #when: apache_installed.rc != 0
      #notify: Redémarrer Apache


    - name: Download apache2
      get_url: url={{ package\_url }}; dest=/tmp/apache2
      when: package_check_deb.rc == 1

    - name: Install apache2
      apt: deb=/tmp/apache2
      sudo: true
      when: package\_check\_deb.rc == 1



    - name: Activer mod_rewrite pour Angular
      apache2_module:
        name: rewrite
        state: present
      notify: Redémarrer Apache

    - name: Copier les fichiers Angular vers /var/www/html/
      synchronize:
        src: "/var/lib/jenkins/workspace/Demo-ansible-pipeline/dist/my-angular-app/"
        dest: "/var/www/html/"
        rsync_opts:
          - "--delete"
      notify: Redémarrer Apache

    - name: Vérifier si la configuration Apache est déjà correcte
      slurp:
        src: /etc/apache2/sites-available/000-default.conf
      register: apache_conf

    - name: Configurer le VirtualHost Apache (si nécessaire)
      copy:
        dest: /etc/apache2/sites-available/000-default.conf
        content: |
          <VirtualHost *:80>
              ServerAdmin webmaster@localhost
              DocumentRoot /var/www/html
              
              <Directory /var/www/html>
                  AllowOverride All
                  Require all granted
              </Directory>
              
              ErrorLog ${APACHE_LOG_DIR}/error.log
              CustomLog ${APACHE_LOG_DIR}/access.log combined
          </VirtualHost>
      when: "'DocumentRoot /var/www/html' not in apache_conf['content'] | b64decode"
      notify: Redémarrer Apache

    - name: Vérifier si l'application Angular est accessible
      uri:
        url: "http://167.86.100.193"
        status_code: 200
      register: site_status
      retries: 5
      delay: 10
      until: site_status.status == 200

  handlers:
    - name: Redémarrer Apache
      service:
        name: apache2
        state: restarted