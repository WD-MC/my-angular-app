---
- name: Déployer l'application Angular avec Apache
  hosts: all
  become: true
  roles:
    - build
  tasks:
    #- name: Activer mod_rewrite pour Angular
      #apache2_module:
        #name: rewrite
        #state: present
      #notify: Redémarrer Apache

    - name: Créer ou mettre à jour le fichier .htaccess
      copy:
        dest: "/var/lib/jenkins/workspace/Demo-ansible-pipeline/dist/my-angular-app/.htaccess"
        content: |
          RewriteEngine On  
          RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
          RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
          RewriteRule ^ - [L]
          RewriteRule ^ /index.html [L]
    
    - name: Activer mod_rewrite
      command: a2enmod rewrite
      notify:
        - Redémarrer Apache

    - name: Modifier la configuration Apache pour autoriser .htaccess
      blockinfile:
        path: /etc/apache2/sites-available/000-default.conf
        insertafter: "<VirtualHost *:80>"
        block: |
          <Directory "/var/lib/jenkins/workspace/Demo-ansible-pipeline/dist/my-angular-app">
              AllowOverride All
              Require all granted
          </Directory>
      notify:
        - Redémarrer Apache

    - name: Redémarrer Apache
      systemd:
        name: apache2
        state: restarted

    - name: Copier les fichiers Angular vers /var/www/html/
      synchronize:
        src: "/var/lib/jenkins/workspace/Demo-ansible-pipeline/dist/my-angular-app/"
        dest: "/var/www/html/"
        rsync_opts:
          - "--delete"
      notify: Redémarrer Apache

    - name: Vérifier si la configuration Apache est déjà correcte
      slurp:
        src: /etc/apache2/sites-available/000-default.conf
      register: apache_conf

    - name: Configurer le VirtualHost Apache (si nécessaire)
      copy:
        dest: /etc/apache2/sites-available/000-default.conf
        content: |
          <VirtualHost *:80>
              ServerAdmin webmaster@localhost
              DocumentRoot /var/www/html
              
              <Directory /var/www/html>
                  AllowOverride All
                  Require all granted
              </Directory>
              
              ErrorLog ${APACHE_LOG_DIR}/error.log
              CustomLog ${APACHE_LOG_DIR}/access.log combined
          </VirtualHost>
      when: "'DocumentRoot /var/www/html' not in apache_conf['content'] | b64decode"
      notify: Redémarrer Apache

    - name: Vérifier si l'application Angular est accessible
      uri:
        url: "http://167.86.100.193"
        status_code: 200
      register: site_status
      retries: 5
      delay: 10
      until: site_status.status == 200

  handlers:
    - name: Redémarrer Apache
      service:
        name: apache2
        state: restarted