---
- name: Déployer l'application Angular avec Apache
  hosts: all  
  become: true

  tasks:
    - name: Vérifier si Apache est installé
      command: dpkg-query -W apache2
      register: apache_installed
      ignore_errors: yes
      changed_when: false

    - name: Installer Apache (si non installé)
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: apache_installed.rc != 0
      notify: Redémarrer Apache

    - name: Copier les fichiers de production sur le serveur
      copy:
        src: /var/lib/jenkins/workspace/Demo-ansible-pipeline/dist/my-angular-app/browser/index.html
        dest: /var/www/html/            # Chemin vers le répertoire web d'Apache sur le serveur distant
        owner: www-data
        group: www-data
        mode: '0755'
    
    - name: Vérifier si l'application Angular est accessible
      uri:
        url: "http://167.86.100.193"
        status_code: 200
      register: site_status
      retries: 5
      delay: 10
      until: site_status.status == 200

    - name: Restart Apache2 service
      service:
        name: apache2
        state: restarted

   