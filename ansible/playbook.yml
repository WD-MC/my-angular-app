---
- name: Déployer l'application Angular avec Apache
  hosts: all  
  become: true

  tasks:
    - name: Update the apt package index
      apt:
        update_cache: yes

    - name: Install Apache2 package
      apt:
        name: apache2
        state: present

    - name: Start and enable Apache2 service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Copy file from Jenkins workspace to remote server
      copy:
        src: /var/lib/jenkins/workspace/Demo-ansible-pipeline/dist/my-angular-app/browser/index.html
        dest: /var/www/html/index.html  # Destination file on the remote node
        owner: root
        group: root
        mode: '0644'

    - name: Restart Apache2 service
      service:
        name: apache2
        state: restarted

    